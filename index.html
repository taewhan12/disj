<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한자 주관식 시험</title>
<style>
:root{--blue:#4263eb;--bg:#f4f6fb;--line:#e0e5ee;--text:#20283a;--muted:#727d91}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:760px;width:calc(100% - 24px);margin:auto;padding:28px 0 50px}
h1{font-size:27px;margin:6px 0}
h2{font-size:19px;margin:0 0 10px}
p{line-height:1.65}
.muted{color:var(--muted);font-size:13px}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;margin:15px 0}
button{cursor:pointer;font:inherit;font-weight:650;border:1px solid var(--line);background:white;border-radius:10px;padding:11px 15px;color:var(--text)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--blue);border-color:var(--blue);color:white}
.full{width:100%;padding:14px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0}
#selectedCount{margin-left:auto;font-size:12px;color:var(--muted)}
.ranges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.range{display:flex;align-items:center;gap:8px;padding:11px 8px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.range:has(input:checked){border-color:var(--blue);background:#edf1ff}
.range input{accent-color:var(--blue);width:16px;height:16px}
.range strong{display:block;font-size:13px}
.range small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
label.field{display:block;text-align:left;font-weight:650;font-size:14px;margin-top:20px}
input.answer{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid #cfd6e3;border-radius:10px;font:inherit;font-size:16px;color:var(--text);background:white}
input.answer:focus{outline:2px solid #a6b7ff;border-color:var(--blue)}
.hanja{font-size:clamp(78px,18vw,112px);font-weight:750;line-height:1.3;text-align:center;padding:18px 0}
.progress{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin:16px 0}
.progress div{height:100%;background:var(--blue);transition:width .2s}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.feedback{padding:15px;border-radius:10px;margin-top:18px;text-align:left;line-height:1.9}
.correct{background:#e8f7ed;color:#176b36}
.incorrect{background:#fff0ed;color:#a93226}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1}
.hidden{display:none!important}
.answerrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}
.answerrow:last-child{border-bottom:0}
@media(max-width:480px){
  .ranges{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:15px}
  #selectedCount{width:100%;margin-left:0}
  .actions button{padding:12px 5px}
}
</style>
</head>
<body>
<main>
<header>
  <div class="muted">HANJA WRITTEN TEST</div>
  <h1>한자 주관식 시험</h1>
  <p class="muted">한자를 보고 뜻과 음을 직접 입력하세요.</p>
</header>

<section id="setup">
  <div class="card">
    <h2>① 시험 범위 선택</h2>
    <p class="muted">10개씩 나뉜 범위를 여러 개 선택할 수 있습니다.</p>

    <div class="toolbar">
      <button id="all">전체 선택</button>
      <button id="none">선택 해제</button>
      <span id="selectedCount"></span>
    </div>

    <div class="ranges" id="ranges"></div>

    <div class="toolbar">
      <label>
        <input type="checkbox" id="shuffle" checked>
        문제 순서 섞기
      </label>
    </div>

    <div class="toolbar">
      <label>
        <input type="checkbox" id="autoNext">
        체점 후 0.7초 뒤 자동으로 다음 문제로 이동
      </label>
    </div>

    <button id="start" class="primary full">시험 시작</button>
  </div>

  <div class="card muted">
    <strong>채점 안내</strong>
    <p>뜻과 음을 각각 입력하고 제출하세요. 띄어쓰기는 채점에서 무시합니다. `/`로 구분된 복수의 답은 각각 정답으로 인정합니다.</p>
  </div>
</section>

<section id="exam" class="hidden">
  <div class="top">
    <button id="back">← 범위 선택</button>
    <span id="counter" class="muted"></span>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div class="card">
    <div id="number" class="muted"></div>
    <div id="hanja" class="hanja"></div>

    <form id="form">
      <label class="field">뜻
        <input id="meaning" class="answer" autocomplete="off"
          placeholder="한자의 뜻을 입력하세요" required>
      </label>

      <label class="field">음
        <input id="sound" class="answer" autocomplete="off"
          placeholder="한자의 음을 입력하세요" required>
      </label>

      <button id="submit" class="primary full" style="margin-top:22px">
        정답 제출 및 채점
      </button>
    </form>

    <div id="feedback" class="hidden"></div>

    <div id="after" class="actions hidden">
      <button id="next" class="primary">다음 문제 →</button>
    </div>
  </div>

  <div class="top muted">
    <span id="rangeInfo"></span>
    <span id="remaining"></span>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <h2>시험 결과</h2>
    <div id="score" style="font-size:27px;font-weight:750;margin:18px 0"></div>
    <p id="scoreDetail" class="muted"></p>

    <div class="actions">
      <button id="wrongOnly" class="primary">틀린 문제 다시 풀기</button>
      <button id="retry">전체 다시 풀기</button>
    </div>

    <button id="home" class="full" style="margin-top:10px">
      범위 다시 선택
    </button>
  </div>

  <div class="card">
    <h2>문제별 결과</h2>
    <div id="review"></div>
  </div>
</section>
</main>

const $ = id => document.getElementById(id);
const SIZE = 10;
const totalRanges = Math.ceil(D.length / SIZE);

let selected = new Set(
  Array.from({length: totalRanges}, (_, i) => i)
);

let questions = [];
let pos = 0;
let results = [];
let graded = false;
let autoNextTimer = null;

// 자동 이동 예약
function scheduleAutoNext() {
  clearTimeout(autoNextTimer);
  autoNextTimer = null;

  if ($("autoNext").checked && graded) {
    autoNextTimer = setTimeout(() => {
      autoNextTimer = null;

      if (graded) {
        nextQuestion();
      }
    }, 700);
  }
}

function norm(s) {
  return s.toLowerCase()
    .replace(/\s+/g, "")
    .replace(/[·ㆍ,，。.!！?？/／]/g, "");
}

function matches(input, answer) {
  const value = norm(input);
  return answer.split("/").some(part => norm(part) === value);
}

function shuffleArray(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderRanges() {
  const root = $("ranges");
  root.replaceChildren();

  for (let i = 0; i < totalRanges; i++) {
    const start = i * SIZE + 1;
    const end = Math.min((i + 1) * SIZE, D.length);

    const label = document.createElement("label");
    label.className = "range";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(i);

    const txt = document.createElement("span");
    const strong = document.createElement("strong");
    strong.textContent = `${start}–${end}번`;

    const small = document.createElement("small");
    small.textContent = `${end - start + 1}개`;

    txt.append(strong, small);
    label.append(cb, txt);
    root.append(label);

    cb.addEventListener("change", () => {
      cb.checked ? selected.add(i) : selected.delete(i);
      updateCount();
    });
  }

  updateCount();
}

function updateCount() {
  let n = 0;

  selected.forEach(i => {
    n += Math.min(SIZE, D.length - i * SIZE);
  });

  $("selectedCount").textContent = `${selected.size}개 범위 · ${n}자`;
  $("start").disabled = n === 0;
}

function begin(items) {
  clearTimeout(autoNextTimer);
  autoNextTimer = null;

  questions = items.slice();

  if ($("shuffle").checked) {
    shuffleArray(questions);
  }

  pos = 0;
  results = [];
  graded = false;

  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("exam").classList.remove("hidden");

  showQuestion();
}

function startExam() {
  const items = [];

  [...selected].sort((a, b) => a - b).forEach(r => {
    for (let i = r * SIZE; i < Math.min((r + 1) * SIZE, D.length); i++) {
      items.push({
        d: D[i],
        idx: i,
        range: r
      });
    }
  });

  begin(items);
}

function showQuestion() {
  const q = questions[pos];

  graded = false;

  $("counter").textContent = `${pos + 1} / ${questions.length}`;
  $("number").textContent = `문제 ${pos + 1}`;
  $("bar").style.width = `${(pos + 1) / questions.length * 100}%`;
  $("hanja").textContent = q.d[0];

  $("meaning").value = "";
  $("sound").value = "";

  $("meaning").disabled = false;
  $("sound").disabled = false;

  $("feedback").className = "hidden";
  $("feedback").textContent = "";

  $("after").classList.add("hidden");
  $("submit").classList.remove("hidden");

  $("rangeInfo").textContent =
    `원래 범위 ${q.range * SIZE + 1}–${Math.min((q.range + 1) * SIZE, D.length)}번`;

  $("remaining").textContent =
    `남은 문제 ${questions.length - pos - 1}개`;

  $("meaning").focus();
}

// 답안 제출 및 채점
$("form").addEventListener("submit", e => {
  e.preventDefault();

  if (graded) return;

  const q = questions[pos];
  const userMeaning = $("meaning").value.trim();
  const userSound = $("sound").value.trim();

  if (!userMeaning || !userSound) {
    alert("뜻과 음을 모두 입력해 주세요.");
    return;
  }

  const meaningOK = matches(userMeaning, q.d[1]);
  const soundOK = matches(userSound, q.d[2]);
  const correct = meaningOK && soundOK;

  results.push({
    q,
    userMeaning,
    userSound,
    meaningOK,
    soundOK,
    correct
  });

  graded = true;

  $("meaning").disabled = true;
  $("sound").disabled = true;
  $("submit").classList.add("hidden");

  const fb = $("feedback");
  fb.className = "feedback " + (correct ? "correct" : "incorrect");
  fb.innerHTML = "";

  const title = document.createElement("strong");
  title.textContent = correct ? "정답입니다!" : "오답입니다.";

  fb.append(title, document.createElement("br"));

  const line1 = document.createElement("span");
  line1.textContent =
    `뜻: ${q.d[1]} — ${meaningOK ? "정답" : "입력: " + userMeaning}`;

  const line2 = document.createElement("span");
  line2.textContent =
    `음: ${q.d[2]} — ${soundOK ? "정답" : "입력: " + userSound}`;

  fb.append(line1, document.createElement("br"), line2);

  $("after").classList.remove("hidden");

  $("next").textContent =
    pos === questions.length - 1 ? "결과 보기" : "다음 문제 →";

  // 자동 이동이 켜져 있으면 0.7초 후 다음 문제로 이동
  scheduleAutoNext();
});

// 다음 문제로 이동
function nextQuestion() {
  clearTimeout(autoNextTimer);
  autoNextTimer = null;

  if (!graded) return;

  if (pos < questions.length - 1) {
    pos++;
    showQuestion();
  } else {
    showResults();
  }
}

// 시험 중에도 자동 이동을 켜고 끌 수 있음
$("autoNext").addEventListener("change", () => {
  if ($("autoNext").checked) {
    // 이미 채점된 문제라면 지금부터 0.7초 후 이동
    scheduleAutoNext();
  } else {
    // 자동 이동을 끄면 예약된 이동 취소
    clearTimeout(autoNextTimer);
    autoNextTimer = null;
  }
});

function showResults() {
  $("exam").classList.add("hidden");
  $("result").classList.remove("hidden");

  const correct = results.filter(r => r.correct).length;

  $("score").textContent = `${correct} / ${results.length} 정답`;
  $("scoreDetail").textContent =
    `정답률 ${Math.round(correct / results.length * 100)}% · 오답 ${results.length - correct}개`;

  const root = $("review");
  root.replaceChildren();

  results.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "answerrow";

    const left = document.createElement("div");
    const title = document.createElement("strong");

    title.textContent = `${i + 1}. ${r.q.d[0]} ${r.correct ? "✓" : "✗"}`;

    const detail = document.createElement("div");
    detail.className = "muted";
    detail.textContent = `입력: ${r.userMeaning} / ${r.userSound}`;

    left.append(title, detail);

    const right = document.createElement("div");
    right.className = "muted";
    right.style.textAlign = "right";
    right.textContent = `${r.q.d[1]} / ${r.q.d[2]}`;

    row.append(left, right);
    root.append(row);
  });

  $("wrongOnly").disabled = correct === results.length;
}

function goHome() {
  clearTimeout(autoNextTimer);
  autoNextTimer = null;

  $("exam").classList.add("hidden");
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");

  renderRanges();
}

$("all").onclick = () => {
  selected = new Set(Array.from({length: totalRanges}, (_, i) => i));
  renderRanges();
};

$("none").onclick = () => {
  selected.clear();
  renderRanges();
};

$("start").onclick = startExam;
$("back").onclick = goHome;
$("next").onclick = nextQuestion;
$("home").onclick = goHome;
$("retry").onclick = () => begin(questions);
$("wrongOnly").onclick = () => {
  begin(results.filter(r => !r.correct).map(r => r.q));
};

renderRanges();
</script>
</body>
</html>
